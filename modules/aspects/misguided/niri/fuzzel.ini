[main]
font=JetBrains Mono:size=11
dpi-aware=auto
prompt="> "
placeholder=Search
icon-theme=Cosmic
icons-enabled=yes
terminal=cosmic-term -e
width=34
lines=10
horizontal-pad=16
vertical-pad=8
inner-pad=6
anchor=center
x-margin=0
y-margin=0
layer=overlay
keyboard-focus=exclusive
match-mode=fzf
sort-result=yes
show-actions=no

[colors]
background=1c1824e6
text=ffffffff
message=c0b8c8ff
prompt=7f3fbfff
placeholder=616161ff
input=ffffffff
match=7f7fffff
selection=7f3fbfff
selection-text=ffffffff
selection-match=d8b2ffff
counter=616161ff
border=7f3fbf99

[border]
width=1
radius=12
